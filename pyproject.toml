[project]
name = "ficha"
version = "0.1.0"
description = "Extração auditável de fichas comparativas de artigos científicos via LLM — Atividade de Construção I (ESPM, Computação Cognitiva, 2026.2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Grupo Atividade I" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymupdf>=1.24",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "typer>=0.12",
  "rich>=13.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Seleção semântica (Seção 4.1, terceiro caminho). Roda em CPU.
embeddings = ["sentence-transformers>=3.0"]
# Modelo local Qwen2.5 na GPU do Colab (Seção 4.3).
local = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.33", "bitsandbytes>=0.43; sys_platform == 'linux'"]
# Modelo por API (Seção 4.3).
api = ["anthropic>=0.40", "openai>=1.40"]
# Notebook executável de ponta a ponta.
notebook = ["jupyter>=1.0", "ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16", "matplotlib>=3.9"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-tqdm",
]

[project.scripts]
ficha = "ficha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ficha"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "ANN", "D"]
ignore = ["D100", "D102", "D104", "D105", "D107", "D203", "D213", "D401", "ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D"]
"notebooks/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
  "slow: testes que baixam modelos ou rodam GPU (pulados por padrão)",
]
filterwarnings = ["ignore::DeprecationWarning"]
